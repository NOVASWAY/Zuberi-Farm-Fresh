name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true
        
      - name: Install dependencies
        run: npm install --legacy-peer-deps
        
      - name: Build with Next.js
        run: |
          echo "Starting Next.js build..."
          npm run build
          echo "Build completed, checking output..."
          ls -la out/
          echo "Checking for errors in build..."
          if [ -f "out/index.html" ]; then
            echo "✅ Main page built successfully"
          else
            echo "❌ Main page not found!"
            exit 1
          fi
        
      - name: Verify Next.js build completed
        run: |
          echo "Checking if build completed successfully..."
          if [ ! -d "out" ]; then
            echo "ERROR: out directory not found!"
            exit 1
          fi
          echo "Build completed successfully"
          
          # Verify critical files exist
          echo "Verifying critical files..."
          if [ ! -f "out/index.html" ]; then
            echo "ERROR: index.html not found!"
            exit 1
          fi
          if [ ! -d "out/products/category" ]; then
            echo "ERROR: Category pages directory not found!"
            exit 1
          fi
          if [ ! -f "out/products/category/international-vegetables/index.html" ]; then
            echo "ERROR: international-vegetables/index.html not found!"
            exit 1
          fi
          if [ ! -f "out/favicon.png" ]; then
            echo "ERROR: favicon.png not found!"
            exit 1
          fi
          echo "✅ All critical files verified"

      - name: Create .nojekyll file
        run: touch out/.nojekyll
        
      - name: Verify build output
        run: |
          echo "Build output contents:"
          ls -la out/
          echo "Favicon files:"
          ls -la out/favicon*
          echo "Category pages:"
          if [ -d "out/products/category" ]; then
            echo "✅ Category directory exists"
            ls -la out/products/category/
          else
            echo "❌ Category directory missing!"
            echo "Products directory contents:"
            ls -la out/products/ || echo "Products directory not found"
          fi
          echo "All products directories:"
          find out/products -type d -name "*" | head -10
          echo "Checking for specific category files:"
          ls -la out/products/category/international-vegetables/index.html || echo "international-vegetables/index.html not found"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          enablement: true
