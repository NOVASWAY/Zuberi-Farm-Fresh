name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true
        
      - name: Install dependencies
        run: npm install --legacy-peer-deps
        
      - name: Build with Next.js
        run: npm run build
        
      - name: Verify Next.js build completed
        run: |
          echo "Checking if build completed successfully..."
          if [ ! -d "out" ]; then
            echo "ERROR: out directory not found!"
            exit 1
          fi
          echo "Build completed successfully"
          
      - name: Create output directory
        run: mkdir -p out

      - name: Create .nojekyll file
        run: touch out/.nojekyll
        
      - name: Verify build output
        run: |
          echo "Build output contents:"
          ls -la out/
          echo "Favicon files:"
          ls -la out/favicon*
          echo "Category pages:"
          ls -la out/products/category/ || echo "Category directory not found"
          echo "All products directories:"
          find out/products -type d -name "*" | head -10
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          enablement: true
