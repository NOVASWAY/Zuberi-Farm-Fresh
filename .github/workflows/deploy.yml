name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true
        
      - name: Install dependencies
        run: npm install --legacy-peer-deps
        
      - name: Build with Next.js
        run: |
          echo "Starting Next.js build..."
          npm run build
          echo "Build completed, checking output..."
          ls -la out/
          echo "Checking for errors in build..."
          if [ -f "out/index.html" ]; then
            echo "✅ Main page built successfully"
          else
            echo "❌ Main page not found!"
            exit 1
          fi
        
      - name: Debug build output
        run: |
          echo "=== DEBUGGING BUILD OUTPUT ==="
          echo "Checking if out directory exists..."
          if [ ! -d "out" ]; then
            echo "ERROR: out directory not found!"
            exit 1
          fi
          echo "✅ out directory exists"
          
          echo ""
          echo "=== Top-level out directory contents ==="
          ls -la out/ | head -20
          
          echo ""
          echo "=== Products directory ==="
          if [ -d "out/products" ]; then
            echo "✅ Products directory exists"
            ls -la out/products/
            echo ""
            echo "=== Products subdirectories ==="
            find out/products -maxdepth 2 -type d
            echo ""
            echo "=== Products files ==="
            find out/products -maxdepth 2 -type f | head -10
          else
            echo "❌ Products directory NOT found!"
          fi
          
          echo ""
          echo "=== Category directory specifically ==="
          if [ -d "out/products/category" ]; then
            echo "✅ Category directory exists"
            ls -la out/products/category/
            echo ""
            echo "=== Category subdirectories ==="
            find out/products/category -type d
            echo ""
            echo "=== Category files ==="
            find out/products/category -type f
          else
            echo "❌ Category directory NOT found!"
            echo "Let's see what's in products:"
            find out/products -type d -o -type f | head -20
          fi
          
          echo ""
          echo "=== Favicon files ==="
          ls -la out/favicon* 2>&1 || echo "No favicon files found"
        
      - name: Verify critical files
        run: |
          echo "=== VERIFYING CRITICAL FILES ==="
          if [ ! -f "out/index.html" ]; then
            echo "ERROR: index.html not found!"
            exit 1
          fi
          echo "✅ index.html exists"
          
          if [ ! -d "out/products/category" ]; then
            echo "ERROR: Category pages directory not found!"
            echo "This might be a build issue. Check the debug output above."
            exit 1
          fi
          echo "✅ Category directory exists"
          
          if [ ! -f "out/products/category/international-vegetables/index.html" ]; then
            echo "ERROR: international-vegetables/index.html not found!"
            echo "Checking what category files exist:"
            find out/products/category -type f | head -10
            exit 1
          fi
          echo "✅ international-vegetables/index.html exists"
          
          if [ ! -f "out/favicon.png" ]; then
            echo "WARNING: favicon.png not found (non-critical)"
          else
            echo "✅ favicon.png exists"
          fi
          
          echo "✅ All critical files verified"

      - name: Create .nojekyll file
        run: touch out/.nojekyll
        
      - name: Verify build output
        run: |
          echo "Build output contents:"
          ls -la out/
          echo "Favicon files:"
          ls -la out/favicon*
          echo "Category pages:"
          if [ -d "out/products/category" ]; then
            echo "✅ Category directory exists"
            ls -la out/products/category/
          else
            echo "❌ Category directory missing!"
            echo "Products directory contents:"
            ls -la out/products/ || echo "Products directory not found"
          fi
          echo "All products directories:"
          find out/products -type d -name "*" | head -10
          echo "Checking for specific category files:"
          ls -la out/products/category/international-vegetables/index.html || echo "international-vegetables/index.html not found"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          enablement: true
