name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4
        
      - name: Install dependencies
        run: pnpm install

      - name: Build with Next.js
        run: |
          # Get repository name for correct base path
          REPO_NAME=$(echo $GITHUB_REPOSITORY | cut -d '/' -f 2)
          echo "Using base path: /$REPO_NAME"
          
          # Set base path and build
          NEXT_PUBLIC_BASE_PATH="/$Zuberi-Farm-Fresh" pnpm run build

          # Ensure correct output directory
          mkdir -p public
          mv ./out ./public || mv ./dist ./public || mv .next ./public

      - name: Debug Build Output
        run: ls -la public

      - name: Create .nojekyll file
        run: touch public/.nojekyll
        
      - name: Create 404 page for redirecting
        run: |
          cat > public/404.html << EOL
          <!DOCTYPE html>
          <html>
            <head>
              <meta charset="utf-8">
              <title>Redirecting...</title>
              <script>
                const repoName = location.pathname.split('/')[1];
                window.location.href = '/' + repoName;
              </script>
            </head>
            <body>
              <p>Redirecting to homepage...</p>
            </body>
          </html>
          EOL

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
