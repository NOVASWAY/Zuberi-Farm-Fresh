<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Page Not Found</title>
    <script type="text/javascript">
      // Redirect to home page for actual 404 errors
      if (window.location.pathname === '/404' || window.location.pathname === '/404.html') {
        window.location.replace('/');
      }
    </script>
  </head>
  <body>
    <p>Page not found. <a href="/">Go to home page</a></p>
  </body>
</html>
